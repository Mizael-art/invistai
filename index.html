<style>

.tg{width:46px;height:26px;border-radius:99px;background:var(--bd);border:0;position:relative;cursor:pointer}.tg.on{background:var(--g)}.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}.tg.on:after{left:23px}
.lrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.split{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}.split .l{padding:40px;background:radial-gradient(500px 400px at 30% 90%,rgba(70,245,138,.35),transparent 70%),#030906;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:14px}.split .auth{width:100%;margin:auto}
.thumb{width:44px;height:44px;border-radius:8px;display:grid;place-items:center;background:var(--gd);flex:none}

.gs-m{display:none}.hg>*,.grid>*,main>*{min-width:0}main{overflow-x:clip}@media(max-width:899px){header .ic[data-act=lang],header .ic[data-act=theme]{display:none}header{gap:8px}.lg{font-size:19px}.hg .card,.vipc{width:100%}}

.ico-in{position:relative}.ico-in input{width:100%;padding-left:38px}.ico-in svg{position:absolute;left:11px;top:11px;color:var(--mt)}

.md{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:14px;align-items:start}

.plan li,.ck li{list-style:none;padding:4px 0}.plan li:before,.ck li:before{content:"✔";color:var(--g);margin-right:8px}.plan ul,.ck{padding:0;margin:10px 0}
.vh{border-radius:14px;padding:28px;border:1px solid var(--bd);background:radial-gradient(480px 320px at 15% 100%,rgba(70,245,138,.2),transparent 70%),var(--sf)}.vh h1{font-size:34px}.vh h1 em{color:var(--g);font-style:normal}
.chat{display:grid;grid-template-columns:240px minmax(0,1fr) 260px;gap:14px;align-items:start}
.cl{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent}.cl.on{background:var(--gd);border-color:var(--g)}

.sc4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sc4>div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;font-size:12px}
.stp{display:flex;justify-content:space-between;margin:10px 0}.stp i{width:26px;height:26px;border-radius:50%;border:1px solid var(--bd);display:grid;place-items:center;font-style:normal;font-size:12px}.stp .on{background:var(--g);color:var(--on);border-color:var(--g)}
.str{height:6px;border-radius:9px;background:var(--bd);overflow:hidden}.str i{display:block;height:100%;background:var(--g);transition:.2s}
.nt{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--bd);cursor:pointer}.nt.u:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--g);flex:none}
@media(max-width:1100px){.chat{grid-template-columns:1fr}.chat .rt{display:none}.md{grid-template-columns:1fr}}

</style></head><body><div id="root"></div><div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s);
const L={pt:{home:'Início',market:'Mercado',news:'Notícias',learn:'Aprender',vip:'VIP',fav:'Favoritos',notif:'Notificações',prof:'Perfil',sup:'Suporte',out:'Sair',search:'Buscar ativo (ex.: BTC, PETR4)',hi:'Olá',all:'Todos',noRes:'Nenhum resultado encontrado.',ai:'Analisar com IA',demo:'DADOS DEMONSTRATIVOS — nenhuma informação real, nenhum backend conectado',signals:'Sinais',chat:'Chat IA'},
en:{home:'Home',market:'Market',news:'News',learn:'Learn',vip:'VIP',fav:'Favorites',notif:'Notifications',prof:'Profile',sup:'Support',out:'Sign out',search:'Search asset (e.g. BTC, PETR4)',hi:'Hello',all:'All',noRes:'No results found.',ai:'Analyze with AI',demo:'DEMO DATA — no real information, no backend connected',signals:'Signals',chat:'AI Chat'}};
const t=k=>L[S.lang][k]||k;
let S={theme:'dark',lang:'pt',auth:false,vip:'free',fav:new Set(['BTC']),read:new Set(),chats:[{id:1,title:'Análise BTC',m:[]}],cur:1,cat:'all',q:'',sort:'ch',dir:-1,period:'1M',candle:false,nf:'all',tab:'chart',step:1,pay:'pix'};
try{Object.assign(S,JSON.parse(localStorage.getItem('iv')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('iv',JSON.stringify({theme:S.theme,lang:S.lang}))}catch(e){}};
const A=[['BTC','Bitcoin','cs',64210,2.4],['ETH','Ethereum','cs',3120,-1.1],['SOL','Solana','cf',148,4.8],['BTCUSDT','BTC Perpétuo','cf',64190,2.3],['PETR4','Petrobras PN','ab',38.4,0.9],['VALE3','Vale ON','ab',61.2,-0.6],['AAPL','Apple Inc.','ai',212,1.2],['MSFT','Microsoft','ai',415,0.4],['HGLG11','CSHG Logística','fii',160.5,0.2],['MXRF11','Maxi Renda','fii',10.4,-0.1],['IVVB11','iShares S&P 500','etf',305,0.7],['BOVA11','iShares Ibovespa','etf',128,0.3],['EURUSD','Euro/Dólar','fx',1.08,-0.2],['USDBRL','Dólar/Real','fx',5.4,0.5]].map(a=>({s:a[0],n:a[1],c:a[2],p:a[3],ch:a[4]}));
const CATS={cs:'Cripto spot',cf:'Cripto futuros',ab:'Ações BR',ai:'Ações int.',fii:'FIIs',etf:'ETFs',fx:'Forex'};
const NW=[['Cripto: exemplo de manchete A','cr','BTC'],['Bolsa: exemplo de manchete B','ac','PETR4'],['Economia global: exemplo C','ec','USDBRL'],['Forex: exemplo de manchete D','fx','EURUSD']].map((n,i)=>({id:i,t:n[0],c:n[1],a:n[2]}));
const NC={cr:'Criptomoedas',ac:'Ações e bolsa',ec:'Economia global',fx:'Forex e moedas'};
const LR=[['Como funciona o Bitcoin?','Guia',0,0],['Análise técnica para iniciantes','Vídeo',18,0],['O que são ETFs?','Artigo',12,0],['Estratégias avançadas de risco','Ebook',40,1]];
const SG=[['BTC','LONG',63800,[65000,66200],62900,'Ativo'],['ETH','SHORT',3180,[3050,2980],3260,'Alvo atingido'],['SOL','LONG',140,[150,158],135,'Stop atingido'],['EURUSD','SHORT',1.085,[1.075],1.09,'Encerrado']];
const NT=[['Sinais','Novo sinal demonstrativo em BTC'],['Pagamentos','Fatura de exemplo disponível'],['Lives','Live de exemplo amanhã 19h'],['Conta','Confirme seu e-mail']].map((n,i)=>({id:i,c:n[0],t:n[1]}));
const SUP='suporte@exemplo.invalid (placeholder configurável)';
const vipOn=()=>S.vip==='active'||S.vip==='cancelled_paid'||S.vip==='cancel_req';
const VS={free:'Gratuito',active:'VIP ativo',pending:'Pagamento pendente',refused:'Pagamento recusado',suspended:'Assinatura suspensa',expired:'Assinatura expirada',cancel_req:'Cancelamento solicitado',cancelled_paid:'Cancelada (período pago vigente)'};
function spark(seed,up,w=120,h=36){let y=h/2,p=[];for(let i=0;i<24;i++){y+=Math.sin(seed*7+i*1.7)*4+(up?-.6:.6);y=Math.max(4,Math.min(h-4,y));p.push((i*w/23).toFixed(1)+','+y.toFixed(1))}return`<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" aria-hidden="true"><polyline fill="none" stroke="${up?'var(--g)':'var(--rd)'}" stroke-width="2" points="${p.join(' ')}"/></svg>`}
function chart(sym){const n={'1D':20,'1S':30,'1M':45,'1A':70}[S.period]||45;const seed=sym.length+n;let v=60,pts=[],c='';for(let i=0;i<n;i++){const o=v;v+=Math.sin(seed+i*.9)*7+Math.cos(i*.4)*5+1;pts.push(v);const x=10+i*(580/n),up=v>=o;if(S.candle)c+=`<line x1="${x}" x2="${x}" y1="${190-Math.max(o,v)*1.6-6}" y2="${190-Math.min(o,v)*1.6+6}" stroke="${up?'var(--g)':'var(--rd)'}"/><rect x="${x-2}" width="4" y="${190-Math.max(o,v)*1.6}" height="${Math.max(2,Math.abs(v-o)*1.6)}" fill="${up?'var(--g)':'var(--rd)'}"/>`}
return`<svg viewBox="0 0 600 200" width="100%" role="img" aria-label="Gráfico demonstrativo">${S.candle?c:`<polyline fill="none" stroke="var(--g)" stroke-width="2.5" points="${pts.map((p,i)=>(10+i*580/n)+','+(190-p*1.6)).join(' ')}"/>`}</svg>`}
const fmt=n=>n.toLocaleString(S.lang==='pt'?'pt-BR':'en-US',{maximumFractionDigits:n<10?4:2});
const chg=c=>`<span class="num ${c>=0?'up':'dn'}">${c>=0?'+':''}${c.toFixed(2)}%</span>`;
const star=(k)=>`<button class="ic" data-act="fav" data-k="${k}" aria-pressed="${S.fav.has(k)}" aria-label="Favoritar">${S.fav.has(k)?'★':'☆'}</button>`;
const lockBox=(why,btn,go)=>`<div class="lock"><h2>🔒 ${why}</h2><p class="mt">Acesso bloqueado pelo estado atual da assinatura demonstrativa.</p><button class="btn" data-go="${go}">${btn}</button></div>`;
let assetCard=a=>`<div class="card" style="cursor:pointer" data-go="asset/${a.s}"><div class="row sp"><b>${a.s}</b>${chg(a.ch)}</div><div class="mt">${a.n}</div><div class="num" style="font-size:20px">${fmt(a.p)}</div>${spark(a.s.length+a.p%7,a.ch>=0)}</div>`;
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
function modal(h){const d=document.createElement('div');d.className='mo';d.innerHTML=`<div class="card" role="dialog" aria-modal="true">${h}</div>`;d.onclick=e=>{if(e.target===d||e.target.dataset.close!==undefined)d.remove()};document.body.append(d);return d}
const R={};
R.home=()=>`<h1>${t('hi')}, Demo 👋</h1><p class="mt">Resumo demonstrativo do mercado</p>
<div class="grid g3">${A.slice(0,4).map(assetCard).join('')}</div><br>
<div class="grid g2"><div class="card"><div class="row sp"><h2>Mercado</h2><button class="btn s" data-go="market">Ver todos os ativos</button></div>${chart('HOME')}</div>
<div class="card"><h2>Notícias importantes</h2>${NW.slice(0,3).map(n=>`<p><a href="#news/${n.id}">${n.t}</a></p>`).join('')}</div>
<div class="card"><h2>VIP <span class="bd v">${VS[S.vip]}</span></h2><p class="mt">Sinais, análises ao vivo, biblioteca premium e Chat IA ampliado.</p><div class="row"><button class="btn" data-go="vip">Conhecer VIP</button><button class="btn s" data-go="signals">Ver sinais</button><button class="btn s" data-go="profile">Gerenciar assinatura</button></div></div>
